<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 Votación - Expo Logística UPEC 2026</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            color: #1f4e78;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .instruccion {
            background: #edf2f7;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 4px solid #667eea;
            font-size: 14px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #1f4e78;
            font-size: 15px;
        }

        select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.2);
        }

        select:disabled {
            background: #f5f5f5;
            color: #999;
            cursor: not-allowed;
        }

        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-votar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-votar:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-votar:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .mensaje {
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            font-weight: 600;
            display: none;
            font-size: 16px;
        }

        .mensaje.show {
            display: block;
        }

        .mensaje.success {
            background: #c6f6d5;
            color: #22543d;
            border: 2px solid #9ae6b4;
        }

        .mensaje.error {
            background: #fed7d7;
            color: #742a2a;
            border: 2px solid #fc8181;
        }

        .mensaje.info {
            background: #bee3f8;
            color: #2c5282;
            border: 2px solid #90cdf4;
        }

        .bloqueado {
            text-align: center;
            padding: 40px;
            background: #f5f5f5;
            border-radius: 12px;
        }

        .bloqueado h2 {
            color: #1f4e78;
            margin-bottom: 15px;
            font-size: 24px;
        }

        .bloqueado p {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
        }

        .icono-bloqueado {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .cargando {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 VOTACIÓN</h1>
            <p>Expo Logística y Transporte UPEC 2026</p>
        </header>

        <div id="formulario">
            <div class="instruccion">
                <strong>Selecciona UN caso de cada categoría:</strong><br>
                • 1 Caso Junior<br>
                • 1 Caso Senior<br>
                • 1 Poster
            </div>

            <div class="form-group">
                <label for="junior">📋 Selecciona un Caso JUNIOR:</label>
                <select id="junior" disabled>
                    <option value="">Cargando...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="senior">📋 Selecciona un Caso SENIOR:</label>
                <select id="senior" disabled>
                    <option value="">Cargando...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="poster">📋 Selecciona un POSTER:</label>
                <select id="poster" disabled>
                    <option value="">Cargando...</option>
                </select>
            </div>

            <button class="btn-votar" id="btnVotar" onclick="registrarVoto()" disabled>
                ✓ REGISTRAR MIS VOTOS
            </button>

            <div id="mensaje" class="mensaje"></div>
        </div>

        <div id="bloqueado" style="display: none;">
            <div class="bloqueado">
                <div class="icono-bloqueado">✅</div>
                <h2>¡Gracias por tu voto!</h2>
                <p>Ya has registrado tus votos en esta exposición.</p>
                <p style="margin-top: 15px; font-size: 14px; opacity: 0.7;">
                    Tu dispositivo está bloqueado para evitar votos duplicados.
                </p>
            </div>
        </div>
    </div>

    <script src="casos_data.json"></script>
    <script src="app.js"></script>
</body>
</html>
