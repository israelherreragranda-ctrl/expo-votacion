<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Resultados en Vivo - Expo Logística UPEC 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container { max-width: 1800px; margin: 0 auto; }

        header {
            background: linear-gradient(135deg, #1f4e78 0%, #2c5aa0 100%);
            color: white;
            padding: 40px;
            text-align: center;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        header h1 { font-size: 48px; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        header p { font-size: 20px; opacity: 0.9; }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        .stat-card:hover { transform: translateY(-5px); }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .number {
            font-size: 56px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-card.total {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .stat-card.total h3,
        .stat-card.total .number {
            color: white;
            -webkit-text-fill-color: unset;
            background: none;
            background-clip: unset;
        }

        .stat-card.total .number { font-size: 72px; }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .chart-wrapper {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .chart-wrapper h2 {
            color: #1f4e78;
            margin-bottom: 20px;
            font-size: 24px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 15px;
        }

        .chart-container {
            position: relative;
            height: 400px;
            margin-bottom: 20px;
        }

        .top-cases {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 40px;
        }

        .top-cases h2 {
            color: #1f4e78;
            margin-bottom: 20px;
            font-size: 24px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 15px;
        }

        .top-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .top-item {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .top-item h3 {
            color: #1f4e78;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .top-item p {
            color: #666;
            margin: 8px 0;
            font-size: 14px;
        }

        .top-item .votes {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            margin-top: 10px;
        }

        .updated-time {
            text-align: center;
            color: white;
            font-size: 14px;
            margin-top: 20px;
            opacity: 0.8;
        }

        .status {
            text-align: center;
            color: white;
            font-size: 12px;
            margin-top: 10px;
        }

        .status.synced { color: #48bb78; }
        .status.syncing { color: #fbbf24; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 RESULTADOS EN VIVO</h1>
            <p>Expo Logística y Transporte UPEC 2026</p>
            <div class="status synced" id="syncStatus">✅ Sincronizado</div>
        </header>

        <div class="stats-container">
            <div class="stat-card total">
                <h3>Total de Votos</h3>
                <div class="number" id="totalVotos">0</div>
            </div>
            <div class="stat-card">
                <h3>Casos Junior</h3>
                <div class="number" id="votosJunior">0</div>
            </div>
            <div class="stat-card">
                <h3>Casos Senior</h3>
                <div class="number" id="votosSenior">0</div>
            </div>
            <div class="stat-card">
                <h3>Posters</h3>
                <div class="number" id="votosPosters">0</div>
            </div>
            <div class="stat-card">
                <h3>Dispositivos Activos</h3>
                <div class="number" id="totalDispositivos">0</div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-wrapper">
                <h2>📊 Casos Junior</h2>
                <div class="chart-container">
                    <canvas id="graficoJunior"></canvas>
                </div>
            </div>

            <div class="chart-wrapper">
                <h2>📊 Casos Senior</h2>
                <div class="chart-container">
                    <canvas id="graficoSenior"></canvas>
                </div>
            </div>

            <div class="chart-wrapper">
                <h2>📊 Posters</h2>
                <div class="chart-container">
                    <canvas id="graficoPosters"></canvas>
                </div>
            </div>
        </div>

        <div class="top-cases">
            <h2>🏆 Top Proyectos Más Votados</h2>
            <div class="top-grid">
                <div id="topJunior"></div>
                <div id="topSenior"></div>
                <div id="topPoster"></div>
            </div>
        </div>

        <div class="updated-time">
            ⏱️ Última actualización: <span id="horaPrecisa">--:--:--</span>
        </div>
    </div>

    <script src="casos_data.json"></script>
    <script>
        let casosData = {};
        let votosData = {};
        let graficos = {};

        const GOOGLE_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwRpD_EgbzXa7qhlfMbehCE8CJeg66iHDmVjo9TbEnxn8qVm_zdetW5lWPsamjSNDlh/exec';

        async function cargarDatos() {
            try {
                const response = await fetch('casos_data.json');
                casosData = await response.json();
                console.log('✅ Datos cargados');
            } catch (error) {
                console.error('Error:', error);
                casosData = { junior: [], senior: [], posters: [] };
            }
        }

        async function sincronizarDatos() {
            try {
                document.getElementById('syncStatus').textContent = '⏳ Sincronizando...';
                document.getElementById('syncStatus').className = 'status syncing';

                const response = await fetch(GOOGLE_APPS_SCRIPT_URL);
                const datos = await response.json();
                
                if (Array.isArray(datos) && datos.length > 0) {
                    votosData = {};
                    
                    for (let i = 1; i < datos.length; i++) {
                        const fila = datos[i];
                        if (fila[0]) {
                            votosData[fila[0]] = {
                                votos: parseInt(fila[1]) || 0,
                                categoria: fila[2] || '',
                                nombre: fila[3] || '',
                                dispositivos: fila[4] ? JSON.parse(fila[4]) : []
                            };
                        }
                    }
                }

                actualizarTodo();
                
                document.getElementById('syncStatus').textContent = '✅ Sincronizado';
                document.getElementById('syncStatus').className = 'status synced';

            } catch (error) {
                console.error('Error de sincronización:', error);
                document.getElementById('syncStatus').textContent = '❌ Error de sincronización';
                document.getElementById('syncStatus').className = 'status';
            }
        }

        function actualizarTodo() {
            actualizarEstadisticas();
            actualizarGraficas();
            actualizarTopCasos();
            actualizarHora();
        }

        function actualizarEstadisticas() {
            let totalVotos = 0;
            let votosJunior = 0;
            let votosSenior = 0;
            let votosPosters = 0;

            for (let codigo in votosData) {
                const voto = votosData[codigo];
                totalVotos += voto.votos;
                
                if (voto.categoria === 'junior') votosJunior += voto.votos;
                else if (voto.categoria === 'senior') votosSenior += voto.votos;
                else if (voto.categoria === 'poster') votosPosters += voto.votos;
            }

            document.getElementById('totalVotos').textContent = totalVotos;
            document.getElementById('votosJunior').textContent = votosJunior;
            document.getElementById('votosSenior').textContent = votosSenior;
            document.getElementById('votosPosters').textContent = votosPosters;

            const dispositivos = new Set();
            for (let codigo in votosData) {
                votosData[codigo].dispositivos.forEach(d => dispositivos.add(d));
            }
            document.getElementById('totalDispositivos').textContent = dispositivos.size;
        }

        function actualizarGraficas() {
            crearGrafica('graficoJunior', calcularDatos('junior'), 'Casos Junior', '#667eea');
            crearGrafica('graficoSenior', calcularDatos('senior'), 'Casos Senior', '#48bb78');
            crearGrafica('graficoPosters', calcularDatos('poster'), 'Posters', '#ed8936');
        }

        function calcularDatos(categoria) {
            let casos = casosData[categoria === 'poster' ? 'posters' : categoria] || [];
            
            let totalVotos = 0;
            const datos = casos.map(caso => {
                const voto = votosData[caso.codigo] || { votos: 0 };
                totalVotos += voto.votos;
                return {
                    codigo: caso.codigo,
                    nombre: caso.nombre,
                    votos: voto.votos
                };
            });

            datos.forEach(dato => {
                dato.porcentaje = totalVotos > 0 ? ((dato.votos / totalVotos) * 100).toFixed(1) : 0;
            });

            datos.sort((a, b) => b.votos - a.votos);
            
            return {
                datos: datos.slice(0, 10),
                totalVotos: totalVotos
            };
        }

        function crearGrafica(elementId, datosCategoria, titulo, color) {
            const ctx = document.getElementById(elementId);
            if (!ctx) return;

            if (graficos[elementId]) {
                graficos[elementId].destroy();
            }

            const datos = datosCategoria.datos;

            graficos[elementId] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: datos.map(d => d.codigo),
                    datasets: [{
                        label: 'Votos',
                        data: datos.map(d => d.votos),
                        backgroundColor: color,
                        borderColor: color,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    indexAxis: 'y',
                    plugins: {
                        legend: { display: false },
                        title: { display: true, text: titulo }
                    },
                    scales: {
                        x: { beginAtZero: true }
                    }
                }
            });
        }

        function actualizarTopCasos() {
            actualizarTopCategoria('junior', 'topJunior');
            actualizarTopCategoria('senior', 'topSenior');
            actualizarTopCategoria('poster', 'topPoster');
        }

        function actualizarTopCategoria(categoria, elementId) {
            const datos = calcularDatos(categoria).datos;
            const elemento = document.getElementById(elementId);
            
            let html = '';
            datos.slice(0, 3).forEach((dato, idx) => {
                const medalla = ['🥇', '🥈', '🥉'][idx];
                html += `
                    <div class="top-item">
                        <h3>${medalla} ${dato.codigo}</h3>
                        <p>${dato.nombre.substring(0, 40)}...</p>
                        <div class="votes">${dato.votos} votos</div>
                        <p style="font-size: 12px; color: #999;">${dato.porcentaje}% del total</p>
                    </div>
                `;
            });
            
            elemento.innerHTML = html || '<div style="color: #999; padding: 20px; text-align: center;">Sin votos aún</div>';
        }

        function actualizarHora() {
            const ahora = new Date();
            const horas = String(ahora.getHours()).padStart(2, '0');
            const minutos = String(ahora.getMinutes()).padStart(2, '0');
            const segundos = String(ahora.getSeconds()).padStart(2, '0');
            document.getElementById('horaPrecisa').textContent = `${horas}:${minutos}:${segundos}`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            cargarDatos();
            sincronizarDatos();
            
            setInterval(sincronizarDatos, 5000);
            setInterval(actualizarHora, 1000);
        });
    </script>
</body>
</html>
